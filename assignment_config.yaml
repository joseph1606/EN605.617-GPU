# Module 6: CUDA streams and events. run.sh takes <file_MB> <threads_per_block>;
# every run compares 1, 2, 4 and 8 streams.

folder: module6

build:
  - []

run:
  # Two file sizes at a fixed block size
  - [64, 256]
  - [256, 256]
  # Block sizes at a fixed file size
  - [256, 128]
  - [256, 512]
  - [256, 1024]
